<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Program</title>
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/css/bootstrap.min.css"/>
     	<link rel="stylesheet" type="text/css" href="/styles.css"/>

</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Edit Program</h1>
        
        <form th:action="@{/update_program}" th:object="${program}" method="post">
            <div class="form-group">
                <label for="name">Program Name:</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="degreeScore">Degree Score (1-9):</label>
                <input type="number" id="degreeScore" th:field="*{degreeScore}" min="1" max="9" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="requiredIncome">Required Income:</label>
                <input type="number" id="requiredIncome" th:field="*{requiredIncome}" step="0.01" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="city">City:</label>
                <input type="text" id="city" th:field="*{city}" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="remote">Remote:</label>
                <input type="checkbox" id="remote" th:field="*{remote}">
            </div>
            <div class="form-group">
                <label for="description">Description:</label>
                <textarea id="description" th:field="*{description}" rows="4" cols="50" class="form-control"></textarea>
            </div>
            <input type="hidden" th:field="*{id}">
            <button type="submit" class="btn btn-primary">Update Program</button>
            <div class="mt-4">
            
            <a th:href="@{/admin}" class="btn btn-primary">Επιστροφή στην Αρχική</a>
        </div>
        </form>
    </div>
</body>
</html>
