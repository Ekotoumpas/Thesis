<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Registration</title>	
<link rel="stylesheet" type="text/css" href="/webjars/bootstrap/css/bootstrap.min.css"/>
 	<link rel="stylesheet" type="text/css" href="/styles.css"/>

</head>	
<body>
	<nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Μεταπτυχιακά προγράμματα</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/login}">Σύνδεση</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin}">Διαχειριστής</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
	<div class="container text-center">
		<div>
		<h1>Εγγραφή Χρήστη</h1>
		</div>
		<form th:action="@{/process_register}" method="post"
		style="max-width:600; margin: 0 auto;"
		th:object="${user}"
		>
		<div class="m-3">
			<div class="form-group row">
				<label class="col-form-label col-4">Διεύθυνση ηλεκτρονικού ταχυδρομείου(E-mail):</label>
				<div class="col-8">
					<input type="email" class="form-control" th:field="*{email}" required minlength="6" maxlength="30"/>
					
				</div>
				
			</div>
			<div class="form-group row">
				<label class="col-form-label col-4">Κωδικός:</label>
				<div class="col-8">
					<input type="password" class="form-control" th:field="*{password}"  required />
					
				</div>
				
			</div>
			<div class="form-group row">
				<label class="col-form-label col-4">Όνομα:</label>
				<div class="col-8">
					<input type="text" class="form-control" th:field="*{firstname}" required minlength="2" maxlength="20"/>
					
				</div>
				
			</div>
			<div class="form-group row">
				<label class="col-form-label col-4">Επώνυμο:</label>
				<div class="col-8">
					<input type="text" class="form-control" th:field="*{lastname}" required minlength="2" maxlength="20"/>
					
				</div>
				
			</div>
			
			
			
			
			<div>
				<button type="submit" class="btn btn-primary">Εγγραφή</button>
			</div>

			
		</div>
		
		</form>
	</div>
	
</body>
</html>
