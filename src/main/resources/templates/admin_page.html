<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Admin Page</title>    
    <link rel="stylesheet" type="text/css" href="/webjars/bootstrap/css/bootstrap.min.css"/>
     	<link rel="stylesheet" type="text/css" href="/styles.css"/>

</head>    
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Μεταπτυχιακά προγράμματα(Διαχειριστής)</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/add_program}">Προσθήκη Προγράμματος</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/applications_list}">Αιτήσεις</a>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="form-inline">
                            <button type="submit" class="btn btn-link nav-link" style="cursor: pointer; text-decoration: none;">Αποσύνδεση</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container text-center mt-4">
        <div>
            <h1>Καλώς Ήρθατε, Διαχειριστή</h1>
        </div>
          <div class="mt-5">
            <h2>Υπάρχοντα Προγράμματα</h2>
            <table class="table table-striped table-bordered">
                <thead class="thead-dark">
                    <tr>
                        <th>ID</th>
                        <th>Όνομα Προγράμματος</th>
                         <th>Ελάχιστος Βαθμός Πτυχίου</th>
                          <th>Απαιτούμενο Μηνιαίο Εισόδημα</th>
                           <th>Πόλη</th>
                            <th>Εξ΄αποστάσεως</th>
                        <th>Περιγραφή</th>
                         <th>Επεξεργασία</th>
 						 <th>Διαγραφη</th>

                    </tr>
                </thead>
                <tbody>
                    <tr th:each="program : ${programs}">
                        <td th:text="${program.id}"></td>
                        <td th:text="${program.name}"></td>
                        <td th:text="${program.degreeScore}"></td>
                        <td th:text="${program.requiredIncome}"></td>
                        <td th:text="${program.city}"></td>
                        <td th:text="${program.remote ? 'Ναι' : 'Όχι'}"></td>
                        <td th:text="${program.description}"></td>
                        <td>
                        <a th:href="@{/edit_program/{id}(id=${program.id})}" class="btn btn-warning btn-sm">Επεξεργασία</a>
                   		</td>
                   		<td>
                    <!-- Σύνδεσμος για διαγραφή προγράμματος -->
                    <a th:href="@{/delete_program/{id}(id=${program.id})} " class="btn btn-warning btn-sm"
                       onclick="return confirm('Are you sure you want to delete this program?');">
                       Διαγραφή
                    </a>
                </td>
                   		
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
